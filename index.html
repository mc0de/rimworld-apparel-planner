<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RimWorld Apparel Planner</title>
<meta name="description" content="Plan RimWorld outfits and compare how every material changes armor and insulation.">
<style>
:root{
  --bg:#141619; --panel:#1d2024; --panel2:#24282d; --panel3:#2b3036; --line:#343940; --line2:#4a5058;
  --text:#ece7dc; --muted:#b4aea2; --dim:#8a857c;
  --accent:#e0b866; --accent2:#f3d9a0; --accentBg:#3a3222;
  --good:#8fd27a; --bad:#ec7f6b; --info:#7db6e3;
  --sharp:#f0a070; --blunt:#d8c47e; --heatA:#f07b7b; --cold:#7cc4ee; --hot:#f2b25c;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:7px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
select,input[type=number],input[type=text],input[type=search]{background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:5px 8px}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--panel3);border:1px solid var(--line2);border-radius:5px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1608;font-weight:600}
.btn.primary:hover{background:var(--accent2);color:#1b1608}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--dim)}
.btn.ghost:hover{color:var(--bad);border-color:transparent}

header{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);background:#101215;position:sticky;top:0;z-index:5}
header h1{font-size:19px;margin:0;color:var(--accent2);font-weight:650}
header .ver{color:var(--dim);font-size:13px}
header .spacer{flex:1}
.ctl{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--muted)}

main{display:grid;grid-template-columns:270px minmax(0,1fr) 420px;gap:14px;padding:14px;align-items:start}
@media (max-width:1350px){main{grid-template-columns:250px minmax(0,1fr)} #summary{grid-column:1 / -1}}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr);padding:10px 16px} header{padding:10px 16px;position:static}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>h2{margin:0;padding:11px 14px;font-size:15px;font-weight:650;color:var(--text);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel>h2 .r{margin-left:auto;display:flex;gap:6px;font-weight:400}
.panel>h2 .sub{font-size:13px;color:var(--dim);font-weight:400}
.pad{padding:12px 14px}

/* picker */
#search{width:100%;margin-bottom:4px}
.grp-h{font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);margin:14px 0 5px}
.it{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:5px;cursor:pointer;border:1px solid transparent}
.it:hover{background:var(--panel2);border-color:var(--line2)}
.it.worn{background:var(--accentBg);border-color:#6b5a33}
.it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .tag{font-size:12px;color:var(--dim);white-space:nowrap}
.it .add{width:16px;text-align:center;color:var(--dim)}
.it.worn .add{color:var(--accent)}

/* outfit */
#loadout{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
#loadout .empty{grid-column:1/-1}
.slot{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--panel2);cursor:pointer}
.slot:hover{border-color:var(--line2)}
.slot.focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.slot .top{display:flex;align-items:baseline;gap:8px}
.slot .top b{font-size:16px;font-weight:650}
.slot .layers{font-size:12.5px;color:var(--dim);margin-top:1px}
.slot .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.slot .row select{flex:1;min-width:120px}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:9px}
.mini div{background:var(--panel);border-radius:4px;padding:3px 6px;text-align:center}
.mini i{display:block;font-style:normal;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.mini b{font-family:var(--mono);font-size:13.5px;font-weight:600}
.empty{color:var(--dim);padding:10px 2px}
.chip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:4px;background:var(--panel3);color:var(--muted);margin:2px 3px 2px 0}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid #0008;vertical-align:-1px;margin-right:6px}

/* material comparison */
#focus .head h3{margin:0;font-size:20px;color:var(--accent2)}
#focus .desc{color:var(--muted);font-size:14px;max-width:80ch;margin-top:3px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--dim);margin-top:8px}
.facts b{color:var(--text);font-weight:550}
.filters{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;margin:14px 0 8px;font-size:14px;color:var(--muted)}
.filters label{display:flex;gap:5px;align-items:center;cursor:pointer}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:#2a2f35;font-weight:600;font-size:13px;color:var(--muted);user-select:none;border-bottom:1px solid var(--line2)}
th[data-sort]{cursor:pointer} th[data-sort]:hover{color:var(--accent2)}
th.sorted{color:var(--accent2)}
th small{display:block;font-weight:400;font-size:11.5px;color:var(--dim)}
th:first-child,td:first-child{text-align:left}
#mtable tbody tr{border-top:1px solid #2c3036;cursor:pointer}
#mtable tbody tr:nth-child(even){background:#202327}
#mtable tbody tr:hover{background:#2c3036}
#mtable tbody tr.cur{background:var(--accentBg);outline:1px solid #6b5a33}
.cell{position:relative;font-family:var(--mono);font-size:14px}
.cell .bar{position:absolute;left:6px;right:6px;bottom:3px;height:3px;border-radius:2px;background:#ffffff10}
.cell .bar i{display:block;height:100%;border-radius:2px;opacity:.85}
.cell .d{display:block;font-size:12px;line-height:1.15;margin-bottom:3px}
.pos{color:var(--good)} .neg{color:var(--bad)} .zero{color:var(--dim)}
.best{font-weight:800;color:var(--accent2)}
.flag{color:var(--dim);font-size:12px;margin-left:4px}
.legend{font-size:13px;color:var(--dim);margin-top:8px}

/* summary */
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big div{background:var(--panel2);border-radius:6px;padding:8px 10px}
.big i{display:block;font-style:normal;font-size:12px;color:var(--dim)}
.big b{font-family:var(--mono);font-size:17px;font-weight:600}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;margin-top:10px}
.kv .v{font-family:var(--mono);text-align:right}
.temp{margin:12px 0 2px}
.tbar{position:relative;height:18px;border-radius:4px;background:linear-gradient(90deg,#2d5d86 0%,#3b7d9f 35%,#5f8f5a 50%,#a0773a 65%,#9a3f30 100%)}
.tbar .rng{position:absolute;top:-3px;bottom:-3px;border:2px solid var(--accent2);border-radius:4px;background:#ffffff22}
.tscale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);font-family:var(--mono);margin-top:3px}
.sect{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.sect h4{margin:0 0 8px;font-size:15px;font-weight:650;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sect h4 span{font-size:13px;color:var(--dim);font-weight:400}
#body td,#body th{padding:6px 7px;font-size:13.5px}
#body td.reg{font-weight:600}
#body .lay{text-align:left;white-space:normal;width:100%}
#body .chip{white-space:nowrap}
.dmg{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-family:var(--mono)}
.dmg .b{width:46px;height:7px;border-radius:3px;background:#ffffff12;overflow:hidden}
.dmg .b i{display:block;height:100%}
.note{font-size:13px;color:var(--dim);margin-top:8px}
details.help{font-size:14px;color:var(--muted)}
details.help summary{cursor:pointer;color:var(--accent)}
details.help p{margin:6px 0}
code{font-family:var(--mono);font-size:13px;color:var(--accent2)}

/* toast */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(10px);background:#2d2a20;border:1px solid var(--accent);color:var(--accent2);padding:9px 14px;border-radius:7px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}

/* presets dialog */
.modal{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.dlg{background:var(--panel);border:1px solid var(--line2);border-radius:10px;width:min(1180px,100%);box-shadow:0 20px 60px #000c}
.dlg-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dlg-h h2{margin:0;font-size:19px;color:var(--accent2)}
.tabs{display:flex;gap:4px;padding:10px 18px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:600}
.tab:hover{color:var(--accent2)}
.tab.on{background:var(--panel2);border-color:var(--line);color:var(--accent2);margin-bottom:-1px;border-bottom:1px solid var(--panel2)}
.dlg-opts{display:flex;gap:10px 20px;flex-wrap:wrap;align-items:center;padding:12px 18px;background:var(--panel2);font-size:14px;color:var(--muted)}
.dlg-opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.dlg-body{padding:16px 18px 20px}
.cat-h{font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);margin:4px 0 8px}
.cat-h:not(:first-child){margin-top:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 13px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
.card:hover{border-color:var(--accent);background:#2a2e33}
.card .t{display:flex;align-items:baseline;gap:8px}
.card .t b{font-size:16px;font-weight:650;color:var(--text)}
.card .t .stage{margin-left:auto;font-size:11.5px;padding:1px 7px;border-radius:10px;background:var(--panel3);color:var(--muted);white-space:nowrap}
.card p{margin:0;font-size:13.5px;color:var(--muted)}
.card .items{font-size:13px;color:var(--dim);line-height:1.5}
.card .items span{color:var(--text)}
.card .kpis{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.card .kpis span{font-family:var(--mono);font-size:12.5px;background:var(--panel);border-radius:4px;padding:2px 7px;color:var(--muted)}
.card .kpis span b{color:var(--text);font-weight:600}
.card .acts{display:flex;gap:6px;justify-content:flex-end}
.save-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.save-row input{flex:1;min-width:200px}
</style>
</head>
<body>
<header>
  <h1>RimWorld Apparel Planner</h1>
  <span class="ver">Core game data · v1.6.4871</span>
  <span class="spacer"></span>
  <button class="btn primary" id="openPresets">Presets</button>
  <div class="ctl"><label for="weapon">Incoming attack</label>
    <select id="weapon"></select>
  </div>
  <div class="ctl" id="customAP" hidden><label for="apInput">AP</label><input id="apInput" type="number" min="0" max="200" step="1" style="width:70px">%</div>
  <div class="ctl"><label for="allQ">Set all quality</label>
    <select id="allQ"><option value="">—</option></select>
  </div>
</header>

<main>
  <section class="panel" id="picker">
    <h2>Add apparel</h2>
    <div class="pad">
      <input type="search" id="search" placeholder="Search, e.g. helmet or legs" autocomplete="off">
      <div id="itemList"></div>
    </div>
  </section>

  <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
    <section class="panel">
      <h2>Worn outfit <span class="sub" id="outfitName"></span>
        <span class="r"><button class="btn sm" id="saveBtn">Save outfit</button><button class="btn sm" id="clearBtn">Clear</button></span></h2>
      <div class="pad" id="loadout"></div>
    </section>
    <section class="panel" id="focus">
      <h2>Material comparison <span class="sub">every material the selected item can be made from</span></h2>
      <div class="pad" id="focusBody"></div>
    </section>
  </div>

  <section class="panel" id="summary">
    <h2>Pawn summary</h2>
    <div class="pad" id="summaryBody"></div>
  </section>
</main>

<div class="modal" id="presetModal" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="presetTitle">
    <div class="dlg-h"><h2 id="presetTitle">Presets</h2><span style="color:var(--dim);font-size:14px">Click a card to wear it. You can undo to get your current outfit back.</span><span style="flex:1"></span><button class="btn" id="closePresets">Close</button></div>
    <div class="tabs" id="presetTabs"></div>
    <div class="dlg-opts">
      <label>Load items at quality <select id="presetQ"></select></label>
      <label title="Gold, silver, plasteel and uranium are off in new bills by default"><input type="checkbox" id="presetRes"> Allow ⚑ materials (plasteel, uranium, gold, silver)</label>
      <span id="presetWeaponNote"></span>
    </div>
    <div class="dlg-body" id="presetBody"></div>
  </div>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span><button class="btn sm" id="toastUndo" hidden>Undo</button></div>

<script>
const DATA = {"stuffs":[{"id":"Silver","label":"silver","cats":["Metallic"],"sharp":0.72,"blunt":0.36,"heat":0.36,"cold":3.0,"hot":0.0,"hpF":0.7,"workF":1,"color":"#b4ad96","desc":"This metal is mostly used as a commodity currency. It can also be used for making decorations."},{"id":"Gold","label":"gold","cats":["Metallic"],"sharp":0.72,"blunt":0.36,"heat":0.36,"cold":3.0,"hot":0.0,"hpF":0.6,"workF":0.9,"color":"#ffeb7a","desc":"The most seductive metal of them all. While it is too soft to be of much practical use, it is strikingly beautiful and never tarnishes. Millions have died in attempting to feed the endless human thirst for gold."},{"id":"Steel","label":"steel","cats":["Metallic"],"sharp":0.9,"blunt":0.45,"heat":0.6,"cold":3.0,"hot":0.0,"hpF":1.0,"workF":1,"color":"#696969","desc":"An iron-carbon metal alloy used for building a huge variety of structures, weapons, and machines."},{"id":"Plasteel","label":"plasteel","cats":["Metallic"],"sharp":1.14,"blunt":0.55,"heat":0.65,"cold":3.0,"hot":0.0,"hpF":2.8,"workF":2.2,"color":"#a0b2b5","desc":"Advanced spacer tech structural material. Plasteel is extremely strong due to its unique molecular structure."},{"id":"WoodLog","label":"wood","cats":["Woody"],"sharp":0.54,"blunt":0.54,"heat":0.4,"cold":8.0,"hot":4.0,"hpF":0.65,"workF":0.7,"color":"#856143","desc":"Wood from trees or other fibrous plants. Useful for building structures and weapons. It is a good fuel for campfires and generators, and can be refined into chemfuel. In a pinch, a piece of wood can be used as a weapon or a leg."},{"id":"Uranium","label":"uranium","cats":["Metallic"],"sharp":1.08,"blunt":0.54,"heat":0.65,"cold":3.0,"hot":0.0,"hpF":2.5,"workF":1.9,"color":"#646464","desc":"A dark, heavy metal. While it is best known as a fuel for nuclear devices, its extreme density and hardness also make it good for making certain weapons, armor, and ammunition."},{"id":"Cloth","label":"cloth","cats":["Fabric"],"sharp":0.36,"blunt":0.0,"heat":0.18,"cold":18.0,"hot":18.0,"hpF":1,"workF":1,"color":"#a29d98","desc":"Cloth woven from organic fibers."},{"id":"Synthread","label":"synthread","cats":["Fabric"],"sharp":0.94,"blunt":0.26,"heat":0.9,"cold":22.0,"hot":22.0,"hpF":1.3,"workF":1,"color":"#aedbe4","desc":"Spacer-tech synthetic fabric designed for making ordinary clothes. It is soft, light, strong, and insulates well."},{"id":"DevilstrandCloth","label":"devilstrand","cats":["Fabric"],"sharp":1.4,"blunt":0.36,"heat":3.0,"cold":20.0,"hot":24.0,"hpF":1.3,"workF":1,"color":"#b43c3c","desc":"Fabric spun from microfibers extracted from devilstrand mushrooms. It is very tough, good at insulating, and protects exceptionally well against flame."},{"id":"Hyperweave","label":"hyperweave","cats":["Fabric"],"sharp":2.0,"blunt":0.54,"heat":2.88,"cold":26.0,"hot":26.0,"hpF":2.4,"workF":1,"color":"#006a7e","desc":"Nano-fibers woven into sheets molecule-by-molecule using specialized production mechanites. While it flexes freely most of the time, it stiffens to absorb blows as they land, and is incredibly difficult to break. The secrets of its production are known only to the most advanced glitterworld cultures."},{"id":"WoolSheep","label":"sheep wool","cats":["Fabric"],"sharp":0.36,"blunt":0.0,"heat":1.1,"cold":26.0,"hot":10.0,"hpF":1,"workF":1,"color":"#dbd6d1","desc":"Sheep's wool. It provides good insulation."},{"id":"WoolAlpaca","label":"alpaca wool","cats":["Fabric"],"sharp":0.36,"blunt":0.0,"heat":1.1,"cold":30.0,"hot":16.0,"hpF":1,"workF":1,"color":"#b4946d","desc":"The remarkably soft wool of an alpaca. It is warm, protects well from heat, and fetches a high price."},{"id":"WoolMegasloth","label":"megasloth wool","cats":["Fabric"],"sharp":0.8,"blunt":0.0,"heat":1.1,"cold":34.0,"hot":12.0,"hpF":1,"workF":1,"color":"#bda174","desc":"While somewhat coarse, megasloth wool's long fibers make it very strong. It is exceptionally warm."},{"id":"WoolMuffalo","label":"muffalo wool","cats":["Fabric"],"sharp":0.36,"blunt":0.0,"heat":1.1,"cold":28.0,"hot":12.0,"hpF":1,"workF":1,"color":"#b3c0ba","desc":"Soft, light and provides very good insulation. Muffalo wool clothes can keep the body warm even in very cold conditions."},{"id":"WoolBison","label":"bison wool","cats":["Fabric"],"sharp":0.36,"blunt":0.0,"heat":1.1,"cold":26.0,"hot":12.0,"hpF":1,"workF":1,"color":"#68452d","desc":"Thick and coarse wool of a bison. Quite warm."},{"id":"Leather_Plain","label":"plainleather","cats":["Leathery"],"sharp":0.81,"blunt":0.24,"heat":1.5,"cold":16.0,"hot":16.0,"hpF":1.3,"workF":1,"color":"#a26a39","desc":"Tanned, dried, scraped skin. A good traditional material for making clothes and bags."},{"id":"Leather_Dog","label":"dog leather","cats":["Leathery"],"sharp":0.81,"blunt":0.24,"heat":1.5,"cold":14.0,"hot":16.0,"hpF":1.3,"workF":1,"color":"#d1a827","desc":"Tanned, dried, scraped skin. A good traditional material for making clothes and bags."},{"id":"Leather_Wolf","label":"wolfskin","cats":["Leathery"],"sharp":1.02,"blunt":0.24,"heat":1.5,"cold":24.0,"hot":16.0,"hpF":1.3,"workF":1,"color":"#736e64","desc":"A soft furry pelt harvested from a wolf-like creature. It is difficult to pierce and insulates well against cold."},{"id":"Leather_Panthera","label":"panthera fur","cats":["Leathery"],"sharp":0.93,"blunt":0.24,"heat":1.5,"cold":16.0,"hot":24.0,"hpF":1.3,"workF":1,"color":"#3c3c3c","desc":"A soft furry pelt harvested from a big cat. It is difficult to pierce and insulates well against heat."},{"id":"Leather_Camel","label":"camelhide","cats":["Leathery"],"sharp":0.81,"blunt":0.24,"heat":1.5,"cold":16.0,"hot":24.0,"hpF":1.3,"workF":1,"color":"#ccb496","desc":"Tanned, dried, scraped camel skin. Good at temperature regulation in hot climates."},{"id":"Leather_Bluefur","label":"bluefur","cats":["Leathery"],"sharp":0.81,"blunt":0.24,"heat":1.5,"cold":20.0,"hot":16.0,"hpF":1.3,"workF":1,"color":"#98aaae","desc":"The furry pelt of muffalo. Recognizable by its distinctive blue tint. Good at temperature regulation in cold cl /* ---------- data prep ---------- */
const STUFF = Object.fromEntries(DATA.stuffs.map(s => [s.id, s]));
const APP = Object.fromEntries(DATA.apparel.map(a => [a.id, a]));
const RESTRICTED = new Set(['Gold','Silver','Plasteel','Uranium','Jade']);
function stuffsFor(a){ return DATA.stuffs.filter(s => s.cats.some(c => a.stuffCats.includes(c))); }
function defaultStuff(a){
  const list = stuffsFor(a); if(!list.length) return null;
  for(const p of ['Cloth','Steel','WoodLog','Leather_Plain']) if(list.find(s=>s.id===p)) return p;
  return list[0].id;
}
const catName = c => ({Leathery:'Leather',Woody:'Wood',Metallic:'Metal'}[c] || c);

/* ---------- stat math (mirrors StatPart_Stuff + StatPart_Quality) ---------- */
function stats(a, stuffId, q){
  const s = stuffId ? STUFF[stuffId] : null;
  const qa = a.quality ? Q_ARMOR[q] : 1, qi = a.quality ? Q_INSUL[q] : 1;
  const m = a.mult, b = a.base;
  const arm = (base, pow) => Math.min(ARMOR_MAX, Math.max(0, (base + (s ? pow*m.armor : 0)) * qa));
  return {
    sharp: arm(b.sharp, s && s.sharp), blunt: arm(b.blunt, s && s.blunt), heat: arm(b.heat, s && s.heat),
    cold: (b.cold + (s ? s.cold*m.cold : 0)) * qi,
    hot:  (b.hot  + (s ? s.hot*m.hot  : 0)) * qi,
    hp:   Math.round(a.hp * (s ? s.hpF : 1)),
    work: a.work ? a.work * (s ? s.workF : 1) : 0,
  };
}
function passFrac(A){ A = Math.max(0, A); return Math.max(1-A,0) + (Math.min(A,1) - A/2)/2; }
function deflectChance(A){ A = Math.max(0, A); return Math.min(A/2, 1); }
const armorKey = t => t==='Sharp'?'sharp':t==='Blunt'?'blunt':'heat';
const outerLayer = a => Math.max(...a.layers.map(l=>LAYER_ORDER[l]));

// worn: [{a, st}] → per region expected damage share & full-block chance
function regionDamage(worn, type, ap){
  const k = armorKey(type);
  return REGIONS.map(([name, groups, weight])=>{
    const layers = worn.filter(x=>x.a.groups.some(g=>groups.includes(g)) && (x.st.sharp>0||x.st.blunt>0||x.st.heat>0))
                       .sort((x,y)=>outerLayer(y.a)-outerLayer(x.a));
    let pass = 1, noBlock = 1;
    for(const x of layers){ const A = x.st[k]-ap; pass *= passFrac(A); noBlock *= 1-deflectChance(A); }
    return {name, weight, layers, pass, block:1-noBlock};
  });
}
function avgPass(worn, type, ap){
  const r = regionDamage(worn, type, ap);
  return r.reduce((s,x)=>s+x.weight*x.pass,0) / r.reduce((s,x)=>s+x.weight,0);
}
function outfitTotals(worn, w){
  let cold=0, hot=0, mass=0; const eq = {};
  for(const {a,st} of worn){ cold+=st.cold; hot+=st.hot; mass+=a.mass; for(const [k,v] of Object.entries(a.equipped)) eq[k]=(eq[k]||0)+v; }
  const regions = regionDamage(worn, w.type, w.ap);
  const avgDmg = regions.reduce((s,r)=>s+r.weight*r.pass,0) / regions.reduce((s,r)=>s+r.weight,0);
  return { cold, hot, mass, eq, tmin:HUMAN.comfyMin-cold, tmax:HUMAN.comfyMax+hot, move:HUMAN.move+(eq.MoveSpeed||0), regions, avgDmg };
}

function load(){
  try{ saved = JSON.parse(localStorage.getItem('rw-apparel-planner-saved') || '[]') || []; }catch(e){ saved = []; }
  try{
    const o = JSON.parse(localStorage.getItem('rw-apparel-planner') || 'null');
    if(o){ hadStorage = true;
           for(const k of ['weapon','customAP','showRestricted','presetQ','presetRes','presetTab','outfitName']) if(o[k]!==undefined) state[k]=o[k];
           state.items = toItems((o.items||[]).map(x=>[x.id,x.stuff,x.q])); }
  }catch(e){}
  try{
    const h = decodeURIComponent(location.hash.slice(1));
    if(h){ const o = JSON.parse(atob(h)); if(Array.isArray(o.i)){ hadStorage = true; state.items = toItems(o.i); if(o.w) state.weapon=o.w; state.outfitName = o.n || ''; } }
  }catch(e){}
}
function save(){
  const {weapon,customAP,showRestricted,presetQ,presetRes,presetTab,outfitName} = state;
  try{ localStorage.setItem('rw-apparel-planner', JSON.stringify({items:state.items.map(({id,stuff,q})=>({id,stuff,q})), weapon,customAP,showRestricted,presetQ,presetRes,presetTab,outfitName})); }catch(e){}
  try{ history.replaceState(null,'','#'+btoa(unescape(encodeURIComponent(JSON.stringify({i:compact(state.items), w:state.weapon, n:state.outfitName}))))); }catch(e){}
}
function saveSaved(){ try{ localStorage.setItem('rw-apparel-planner-saved', JSON.stringify(saved)); }catch(e){} }
const compact = items => items.map(x=>[x.id,x.stuff,x.q]);
function toItems(list){
  const out = [];
  for(const [id,st,q] of list){
    const a = APP[id]; if(!a) continue;
    const stuff = st && STUFF[st] && stuffsFor(a).some(m=>m.id===st) ? st : defaultStuff(a);
    for(let i=out.length-1;i>=0;i--) if(conflicts(APP[out[i].id], a)) out.splice(i,1);
    out.push({uid:uid(), id, stuff, q: Number.isInteger(q) ? q : 2});
  }
  return out;
}

function pct0(v){ return Math.round(v*100)+'%'; }
function pctS(v){ return sign(Math.round(v*100))+'%'; }

function weaponInfo(){
  const w = WEAPONS.find(x=>x[0]===state.weapon) || WEAPONS[6];
  return { key:w[0], label:w[1], type:w[2], ap: w[3]==null ? state.customAP : w[3] };
}
let undoSnap = null;
function toast(msg, undo){
  $('toastMsg').textContent = msg; $('toastUndo').hidden = !undo; undoSnap = undo || null;
  const t=$('toast'); t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'), undo?7000:2500);
}
function conflicts(a, b){
  if(a===b) return true;
  if(!a.layers.some(l=>b.layers.includes(l))) return false;
  const pa = new Set(a.groups.flatMap(g=>GROUP_PARTS[g]||[g]));
  return b.groups.flatMap(g=>GROUP_PARTS[g]||[g]).some(p=>pa.has(p));
}
function itemName(id, stuff){ const a=APP[id]; return (stuff && STUFF[stuff] ? STUFF[stuff].label+' ' : '') + a.label; }
const dmgColor = p => p<=.3?'var(--good)':p<=.55?'#c9cf6a':p<=.8?'var(--hot)':'var(--bad)';

/* ---------- actions ---------- */
function snapshot(){ return {items:compact(state.items), name:state.outfitName}; }
function pickFocus(){
  return (state.items.find(x=>APP[x.id].layers.includes('Shell') && stuffsFor(APP[x.id]).length)
       || state.items.find(x=>stuffsFor(APP[x.id]).length) || state.items[0])?.uid ?? null;
}
function applyOutfit(list, name){
  const snap = snapshot();
  state.items = toItems(list); state.outfitName = name || '';
  state.focus = pickFocus();
  render(); toast('Wearing ' + (name || 'outfit'), snap);
}
function wear(id){
  const a = APP[id];
  const snap = snapshot();
  const removed = state.items.filter(x => conflicts(APP[x.id], a));
  state.items = state.items.filter(x => !removed.includes(x));
  const it = { uid:uid(), id, stuff: defaultStuff(a), q: 2 };
  state.items.push(it); state.focus = it.uid; state.outfitName = '';
  if(removed.length) toast('Took off ' + removed.map(x=>APP[x.id].label).join(', '), snap);
  render();
}
function remove(u){ state.items = state.items.filter(x=>x.uid!==u); if(state.focus===u) state.focus = state.items.at(-1)?.uid ?? null; state.outfitName=''; render(); }

    mat:st=>st.hot, score:t=>t.hot, kpi:'temp' },
  { cat:'Temperature', name:'Widest comfort range', desc:'Lots of cold and heat insulation at once, for biomes with harsh seasons both ways.',
    mat:st=>st.cold+st.hot, score:t=>t.cold+t.hot - Math.abs(t.cold-t.hot)*0.25, kpi:'temp' },
  { cat:'Temperature', name:'Cold, still armored', desc:'Cold insulation first, with sharp protection a close second.',
    mat:st=>st.cold/60+st.sharp, score:t=>t.cold/60 - t.dmg.Sharp, kpi:'temp' },
  { cat:'Special stats', name:'Best social impact', desc:'For your negotiator or warden. Ties go to sharp protection.',
    mat:st=>st.sharp, score:t=>(t.eq.SocialImpact||0) - t.dmg.Sharp*0.01, kpi:'social' },
  { cat:'Special stats', name:'Highest pain tolerance', desc:'Most pain shock threshold, so pawns keep fighting longer.',
    mat:st=>st.sharp, score:t=>(t.eq.PainShockThreshold||0) - t.dmg.Sharp*0.01, kpi:'pain' },
  { cat:'Special stats', name:'Toxic resistance', desc:'Most toxic environment resistance for fallout and polluted areas.',
    mat:st=>st.sharp, score:t=>(t.eq.ToxicEnvironmentResistance||0) - t.dmg.Sharp*0.01, kpi:'tox' },

function optimize(obj, q, allowRes, w){
  const sharpAP = w.type==='Sharp' ? w.ap : 0.165;
  const cands = [];
  for(const a of DATA.apparel){
    if(a.layers.includes('Belt')) continue;
    if(obj.filter && !obj.filter(a)) continue;
    const mats = stuffsFor(a).filter(m=>allowRes || !RESTRICTED.has(m.id));
    if(a.stuffCats.length && !mats.length) continue;
    let stuff = null;
    if(mats.length){ let best=-Infinity; for(const m of mats){ const v = obj.mat(stats(a,m.id,q)); if(v>best+1e-9){best=v;stuff=m.id;} } }
    cands.push({a, stuff, st:stats(a,stuff,q)});
  }
  const n = cands.length;
  const clash = cands.map(x=>cands.map(y=>x!==y && conflicts(x.a,y.a)));
  const evalSet = set=>{
    const worn = set.map(i=>cands[i]);
    // never naked: torso and legs covered
    if(!worn.some(x=>x.a.groups.includes('Torso')) || !worn.some(x=>x.a.groups.includes('Legs'))) return -Infinity;
    const t = outfitTotals(worn, w);
    t.dmg = { Sharp: avgPass(worn,'Sharp',sharpAP), Blunt: avgPass(worn,'Blunt',0), Heat: avgPass(worn,'Heat',0) };
    return obj.score(t) - set.length*1e-4 - t.mass*1e-5;
  };
  let best = -Infinity, bestSet = [];
  const cur = [];
  (function rec(i){
    if(i===n){ const s = evalSet(cur); if(s>best){best=s;bestSet=[...cur];} return; }
    if(!cur.some(j=>clash[i][j])){ cur.push(i); rec(i+1); cur.pop(); }
    rec(i+1);
  })(0);
  return bestSet.map(i=>[cands[i].a.id, cands[i].stuff]).sort((x,y)=>outerLayer(APP[x[0]])-outerLayer(APP[y[0]]));
}

function renderPicker(){
  const q = $('search').value.trim().toLowerCase();
  const wornIds = new Set(state.items.map(x=>x.id));
  let html = ''; const used = new Set();
  for(const [name, test] of PICK_GROUPS){
    const list = DATA.apparel.filter(a => !used.has(a.id) && test(a)).sort((x,y)=>x.label.localeCompare(y.label));
    list.forEach(a=>used.add(a.id));
    const shown = list.filter(a => !q || a.label.toLowerCase().includes(q) || name.toLowerCase().includes(q) || a.groups.join(' ').toLowerCase().includes(q));
    if(!shown.length) continue;
    html += `<div class="grp-h">${name}</div>`;
    for(const a of shown){
      const worn = wornIds.has(a.id);
      const mat = a.stuffCats.length ? a.stuffCats.map(catName).join(' / ') : 'fixed recipe';
      html += `<div class="it${worn?' worn':''}" data-id="${a.id}" title="${esc(a.desc)}&#10;&#10;Covers: ${a.groups.join(', ')}">
        <span class="nm">${esc(cap(a.label))}</span><span class="tag">${mat}</span><span class="add">${worn?'✓':'+'}</span></div>`;
    }
  }
  $('itemList').innerHTML = html || '<div class="empty">No matches.</div>';
}

const COLS = [
  ['label','Material',''],
  ['sharp','Sharp','armor'],['blunt','Blunt','armor'],['heat','Heat','armor'],

function renderFocus(){

        ${eq?`<span>When worn <b>${esc(eq)}</b></span>`:''}
      </div></div>`;

  const mats = stuffsFor(a);
  if(!mats.length){
    el.innerHTML = head + `<p style="margin:14px 0 0;color:var(--muted)">This item has a fixed recipe, so only quality changes its stats:</p>` + qualityTable(a, null);
    return;
  }
  const cats = [...new Set(mats.flatMap(m=>m.cats.filter(c=>a.stuffCats.includes(c))))];
  for(const c of cats) if(state.cats[c]===undefined) state.cats[c]=true;
  const visible = mats.filter(m => m.cats.some(c=>a.stuffCats.includes(c) && state.cats[c]) && (state.showRestricted || !RESTRICTED.has(m.id) || m.id===it.stuff));
  const k = armorKey(w.type);
  const dmgOf = st => passFrac(st[k] - w.ap);
  const cur = stats(a, it.stuff, it.q); cur.dmg = dmgOf(cur);
  const rows = visible.map(m => { const st = stats(a, m.id, it.q); st.dmg = dmgOf(st); st.label = m.label; return {m, st}; });
  const {key, dir} = state.sort;
  rows.sort((x,y)=> key==='label' ? dir*x.st.label.localeCompare(y.st.label) : dir*(x.st[key]-y.st[key]) || x.st.label.localeCompare(y.st.label));
  const max = {}, best = {};
  for(const [c] of COLS.slice(1)){ const vals = rows.map(r=>r.st[c]); max[c] = Math.max(...vals.map(Math.abs), 1e-9); best[c] = (c==='dmg'||c==='work') ? Math.min(...vals) : Math.max(...vals); }
  const colors = {sharp:'var(--sharp)',blunt:'var(--blunt)',heat:'var(--heatA)',cold:'var(--cold)',hot:'var(--hot)',dmg:'var(--bad)',hp:'var(--info)',work:'var(--dim)'};
  const fmt = {sharp:pct,blunt:pct,heat:pct,cold:v=>deg(v),hot:v=>deg(v),dmg:pct0,hp:v=>v,work:v=>Math.round(v/60)};
  const dfmt = {sharp:v=>sign((v*100).toFixed(1)),blunt:v=>sign((v*100).toFixed(1)),heat:v=>sign((v*100).toFixed(1)),cold:v=>sign(v.toFixed(1)),hot:v=>sign(v.toFixed(1)),dmg:v=>sign(Math.round(v*100)),hp:v=>sign(v),work:v=>sign(Math.round(v/60))};
  const lowerBetter = {dmg:1, work:1};

  const filters = `<div class="filters">
    <label>Quality ${qualitySelect(it)}</label>
    <span>Show:</span>
    ${cats.map(c=>`<label><input type="checkbox" data-cat="${c}"${state.cats[c]?' checked':''}> ${catName(c)}</label>`).join('')}
    <label title="Gold, silver, plasteel and uranium are off in new bills by default, but you can allow them"><input type="checkbox" id="showRes"${state.showRestricted?' checked':''}> ⚑ materials</label>
  </div>`;
  const thead = `<thead><tr>${COLS.map(([c,l,sub])=>{
    const s = c==='dmg' ? `vs ${esc(w.label)}` : c==='work' ? 'to make' : sub;
    const tip = c==='dmg' ? `Expected share of ${w.type.toLowerCase()} damage this one item lets through (AP ${pct0(w.ap)})` : c==='work' ? 'Work amount as shown in game' : '';
    return `<th data-sort="${c}" class="${state.sort.key===c?'sorted':''}" title="${tip}">${l}${state.sort.key===c?(state.sort.dir<0?' ▼':' ▲'):''}${s?`<small>${s}</small>`:''}</th>`;}).join('')}</tr></thead>`;
  const tbody = rows.map(({m,st})=>{
    const isCur = m.id===it.stuff;
    return `<tr data-stuff="${m.id}" class="${isCur?'cur':''}" title="${esc(m.desc)}">
      <td>${swatch(m)}${esc(cap(m.label))}${RESTRICTED.has(m.id)?'<span class="flag" title="Off in new bills by default">⚑</span>':''}${isCur?' <span class="chip">worn</span>':''}</td>
      ${COLS.slice(1).map(([c])=>{
        const v = st[c], d = v - cur[c];
        const good = lowerBetter[c] ? d<0 : d>0;
        const dTxt = isCur || Math.abs(d)<1e-6 ? '<span class="d zero">·</span>' : `<span class="d ${good?'pos':'neg'}">${dfmt[c](d)}</span>`;
        const isBest = Math.abs(v-best[c])<1e-9 && rows.length>1;
        return `<td class="cell"><span class="${isBest?'best':''}">${fmt[c](v)}</span>${dTxt}<span class="bar"><i style="width:${Math.max(0,Math.abs(v)/max[c]*100)}%;background:${colors[c]}"></i></span></td>`;
      }).join('')}
    </tr>`;
  }).join('');
  el.innerHTML = head + filters + `<div class="tblwrap"><table id="mtable">${thead}<tbody>${tbody}</tbody></table></div>
    <div class="legend">Click a row to use that material. Green and red numbers show the change from what's worn now. <span class="best">Bold</span> marks the best value in each column. Armor caps at 200%.</div>`;
}

        <p><code>Insulation = (base + material insulation × item insulation multiplier) × quality</code></p>
        <p>Armor quality factors: ${QUALITIES.map((n,i)=>n+' ×'+Q_ARMOR[i]).join(', ')}.<br>Insulation quality factors: ${QUALITIES.map((n,i)=>n+' ×'+Q_INSUL[i]).join(', ')}.</p>
        <p>Two items conflict when they share a layer and cover any of the same body parts, as in the game. Adding an item takes off whatever it conflicts with.</p>
        <p>Hit shares per body part come from the human body's part coverage values. Data is from the game's Core XML files (v1.6.4871). DLC items aren't included.</p>
      </details>
    </div>`;
}

/* ---------- presets dialog ---------- */
function wornFrom(items){ return toItems(items).map(it=>({a:APP[it.id], st:stats(APP[it.id], it.stuff, it.q)})); }
function kpiChips(items, kind){
  const w = weaponInfo();
  const worn = wornFrom(items);
  const t = outfitTotals(worn, w);
  const chips = [];
  if(kind==='blunt') chips.push(`Blunt dmg <b>${pct0(avgPass(worn,'Blunt',0))}</b>`);
  else if(kind==='fire') chips.push(`Fire dmg <b>${pct0(avgPass(worn,'Heat',0))}</b>`);
  else chips.push(`Dmg taken <b>${pct0(w.type==='Sharp'?t.avgDmg:avgPass(worn,'Sharp',0.165))}</b>`);
  chips.push(`<b>${t.tmin.toFixed(0)}°</b> to <b>${t.tmax.toFixed(0)}°C</b>`);
  chips.push(`Speed <b>${Math.round(t.move/HUMAN.move*100)}%</b>`);
  if(kind==='social') chips.push(`Social <b>${pctS(t.eq.SocialImpact||0)}</b>`);
  if(kind==='pain') chips.push(`Pain shock <b>${pctS(t.eq.PainShockThreshold||0)}</b>`);
  if(kind==='tox') chips.push(`Toxic res. <b>${pctS(t.eq.ToxicEnvironmentResistance||0)}</b>`);
  return chips.map(c=>`<span>${c}</span>`).join('');
}
const itemsLine = list => list.map(([id,st])=>`<span>${esc(itemName(id,st))}</span>`).join(' · ');
const presetCache = {};
function maxList(i){
  const w = weaponInfo(), q = state.presetQ;
  const key = [i,q,state.presetRes,w.type,w.ap].join('|');
  return presetCache[key] || (presetCache[key] = optimize(OBJECTIVES[i], q, state.presetRes, w));
}
function renderPresets(){
  const tabs = [['popular','Popular builds'],['max','Maximize a stat'],['mine',`My outfits${saved.length?` (${saved.length})`:''}`]];
  $('presetTabs').innerHTML = tabs.map(([k,l])=>`<button class="tab${state.presetTab===k?' on':''}" data-tab="${k}">${l}</button>`).join('');
  $('presetQ').value = state.presetQ; $('presetRes').checked = state.presetRes;
  $('presetQ').closest('label').hidden = state.presetTab==='mine';
  $('presetRes').closest('label').hidden = state.presetTab!=='max';
  const w = weaponInfo();
  $('presetWeaponNote').innerHTML = `Card stats are vs <b style="color:var(--text)">${esc(w.label)}</b> (change it in the top bar)`;
  const q = state.presetQ;
  const withQ = list => list.map(([id,st])=>[id,st,q]);
  let html = '';
  const group = (list, card) => { let last = ''; list.forEach((p,i)=>{ if(p.cat!==last){ if(last) html += '</div>'; html += `<div class="cat-h">${p.cat}</div><div class="cards">`; last = p.cat; } html += card(p,i); }); html += '</div>'; };
  if(state.presetTab==='popular'){
    group(POPULAR, (p,i)=>`<button class="card" data-pop="${i}"><div class="t"><b>${esc(p.name)}</b><span class="stage">${p.stage}</span></div>
        <p>${esc(p.desc)}</p><div class="items">${itemsLine(p.items)}</div><div class="kpis">${kpiChips(withQ(p.items))}</div></button>`);
  } else if(state.presetTab==='max'){
    group(OBJECTIVES, (o,i)=>{ const list = maxList(i); return `<button class="card" data-max="${i}"><div class="t"><b>${esc(o.name)}</b><span class="stage">calculated</span></div>
        <p>${esc(o.desc)}</p><div class="items">${itemsLine(list)}</div><div class="kpis">${kpiChips(withQ(list),o.kpi)}</div></button>`; });
    html += `<p class="note">These are found by trying every valid combination of items, each in its best material for the goal, at the quality chosen above. Utility belts aren't included, and every outfit covers torso and legs so pawns aren't naked.</p>`;
  } else {
    html += `<div class="save-row"><input type="text" id="saveName" placeholder="Name the current outfit, e.g. Sniper or Doctor" maxlength="40"><button class="btn primary" id="saveNow">Save current outfit</button></div>`;
    if(!saved.length) html += `<div class="empty">No saved outfits yet. Build an outfit and save it here. It stays in this browser.</div>`;
    else html += `<div class="cards">${saved.map((s,i)=>`<div class="card" data-saved="${i}" role="button" tabindex="0"><div class="t"><b>${esc(s.name)}</b></div>
        <div class="items">${s.items.map(([id,st,q])=>`<span>${esc(itemName(id,st))}</span> <span style="color:var(--dim)">(${QUALITIES[q]??'—'})</span>`).join(' · ')}</div>
        <div class="kpis">${kpiChips(s.items)}</div>
        <div class="acts"><button class="btn sm" data-overwrite="${i}" title="Replace with the current outfit">Overwrite</button><button class="btn sm" data-delsaved="${i}">Delete</button></div></div>`).join('')}</div>`;
  }
  $('presetBody').innerHTML = html;
}
function openPresets(tab){ if(tab) state.presetTab = tab; $('presetModal').hidden = false; document.body.style.overflow='hidden'; renderPresets(); }
function closePresets(){ $('presetModal').hidden = true; document.body.style.overflow=''; save(); }
function saveCurrent(name){
  if(!state.items.length){ toast('Nothing worn to save'); return; }
  name = (name||'').trim() || `Outfit ${saved.length+1}`;
  saved.push({name, items:compact(state.items)}); saveSaved(); state.outfitName = name; render();
  toast(`Saved “${name}”`);
}

function render(){ renderPicker(); renderLoadout(); renderFocus(); renderSummary(); save(); }

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const T = e.target;
  if(T.closest('#toastUndo')){ if(undoSnap){ const s=undoSnap; undoSnap=null; state.items = toItems(s.items); state.outfitName = s.name||''; state.focus = pickFocus(); render(); toast('Undone'); } return; }
  if(T.closest('#openPresets')){ openPresets(); return; }
  if(T.closest('#closePresets') || T.id==='presetModal'){ closePresets(); return; }
  const tab = T.closest('[data-tab]'); if(tab){ state.presetTab = tab.dataset.tab; renderPresets(); return; }
  if(T.closest('#saveNow')){ saveCurrent($('saveName').value); renderPresets(); return; }
  const ow = T.closest('[data-overwrite]'); if(ow){ const s = saved[+ow.dataset.overwrite]; if(state.items.length){ s.items = compact(state.items); saveSaved(); renderPresets(); toast(`Updated “${s.name}”`); } return; }
  const ds = T.closest('[data-delsaved]'); if(ds){ const i=+ds.dataset.delsaved; const s=saved[i]; saved.splice(i,1); saveSaved(); renderPresets(); toast(`Deleted “${s.name}”`); return; }
  const pop = T.closest('[data-pop]'); if(pop){ const p = POPULAR[+pop.dataset.pop]; closePresets(); applyOutfit(p.items.map(([id,st])=>[id,st,state.presetQ]), p.name); return; }
  const mx = T.closest('[data-max]'); if(mx){ const i = +mx.dataset.max; const list = maxList(i); closePresets(); applyOutfit(list.map(([id,st])=>[id,st,state.presetQ]), OBJECTIVES[i].name); return; }
  const sv = T.closest('[data-saved]'); if(sv){ const s = saved[+sv.dataset.saved]; closePresets(); applyOutfit(s.items, s.name); return; }
  if(T.closest('#saveBtn')){ openPresets('mine'); setTimeout(()=>$('saveName')?.focus(), 0); return; }

  const del = T.closest('[data-del]'); if(del){ e.stopPropagation(); remove(del.dataset.del); return; }
  const it = T.closest('.it'); if(it){ const ex = state.items.find(x=>x.id===it.dataset.id); if(ex){ state.focus=ex.uid; render(); } else wear(it.dataset.id); return; }
  const th = T.closest('#mtable th[data-sort]'); if(th){ const k=th.dataset.sort; state.sort = {key:k, dir: state.sort.key===k ? -state.sort.dir : (k==='label'||k==='dmg'||k==='work'?1:-1)}; renderFocus(); return; }
  const tr = T.closest('#mtable tr[data-stuff]'); if(tr){ const cur = state.items.find(x=>x.uid===state.focus); if(cur){ cur.stuff = tr.dataset.stuff; state.outfitName=''; render(); } return; }
  const sl = T.closest('.slot'); if(sl && !T.closest('select')){ state.focus = sl.dataset.u; renderLoadout(); renderFocus(); return; }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && !$('presetModal').hidden) closePresets();
  if(e.key==='Enter' && e.target.id==='saveName'){ saveCurrent(e.target.value); renderPresets(); }
  if(e.key==='Enter' && e.target.matches('[data-saved]')) e.target.click();
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.k){ const it = state.items.find(x=>x.uid===t.dataset.u); if(!it) return; it[t.dataset.k] = t.dataset.k==='q' ? +t.value : t.value; state.focus = it.uid; state.outfitName=''; render(); return; }
  if(t.dataset.cat){ state.cats[t.dataset.cat] = t.checked; renderFocus(); return; }
  if(t.id==='showRes'){ state.showRestricted = t.checked; renderFocus(); save(); return; }
  if(t.id==='weapon'){ state.weapon = t.value; $('customAP').hidden = t.value!=='custom'; render(); return; }
  if(t.id==='allQ' && t.value!==''){ for(const it of state.items) if(APP[it.id].quality) it.q=+t.value; t.value=''; render(); return; }
  if(t.id==='presetQ'){ state.presetQ = +t.value; renderPresets(); return; }
  if(t.id==='presetRes'){ state.presetRes = t.checked; renderPresets(); return; }
});
$('apInput').addEventListener('input', e=>{ state.customAP = Math.max(0,(+e.target.value||0)/100); renderFocus(); renderSummary(); save(); });
$('search').addEventListener('input', renderPicker);
$('clearBtn').addEventListener('click', ()=>{ if(!state.items.length) return; const snap = snapshot(); state.items=[]; state.focus=null; state.outfitName=''; render(); toast('Outfit cleared', snap); });

/* ---------- init ---------- */
$('weapon').innerHTML = WEAPONS.map(w=>`<option value="${w[0]}">${esc(w[1])}${w[3]!=null?` · ${w[2]} ${Math.round(w[3]*100)}% AP`:''}</option>`).join('');
$('allQ').innerHTML += QUALITIES.map((n,i)=>`<option value="${i}">${n}</option>`).join('');
$('presetQ').innerHTML = QUALITIES.map((n,i)=>`<option value="${i}">${n}</option>`).join('');
load();
if(!hadStorage){ const p = POPULAR.find(p=>p.name==='Devilstrand standard'); state.items = toItems(p.items.map(([id,st])=>[id,st,2])); state.outfitName = p.name; }
state.focus = pickFocus();
$('weapon').value = state.weapon; $('customAP').hidden = state.weapon!=='custom'; $('apInput').value = Math.round(state.customAP*100);
render();
</script>
</body>
</html>
